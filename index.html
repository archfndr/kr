    <section class="featured-reveal-section shell reveal-on-scroll" aria-label="Today's recommendation">
      <div class="today-recommend">
        <div class="today-recommend-head">
          <span>[ 001 ]</span>
          <span data-en="TODAY'S RECOMMEND" data-ko="오늘의 추천">TODAY'S RECOMMEND</span>
        </div>
        <div class="today-recommend-copy">
          <p class="today-hook">“Love lost”</p>
          <h2>Lost</h2>

      <button class="featured-card featured-card-reveal" data-track="1" aria-label="Open Lost by Frank Ocean">

          <div><span class="micro">ARCHIVE 1</span><h2>Lost</h2><p>Frank Ocean</p></div>
