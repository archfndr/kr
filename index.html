<body class="page-home" data-page="home">
  <header class="site-header">
    <a class="brand" href="/" aria-label="ArchFndr home"><span class="brand-logo" aria-hidden="true"></span></a>
    <nav class="main-nav" aria-label="Primary navigation">
      <div class="nav-branch">
        <button class="nav-branch-toggle" type="button" aria-expanded="false" aria-controls="findsSubmenu"><span>FINDS</span><span class="nav-branch-chevron" aria-hidden="true">›</span></button>
        <div class="nav-submenu" id="findsSubmenu">
          <a href="/finds/song/">SONG</a>
          <a href="/finds/artist/">ARTIST</a>
        </div>
      </div>
      <a href="/archive/">ARCHIVE</a>
    </nav>
    <div class="header-actions">
      <button class="menu-toggle" type="button" aria-label="Open menu">MENU</button>
    </div>
  </header>

  <main>
    <section class="home-hero shell home-identity" id="homeIdentity">
      <div class="identity-lockup">
        <h1 class="identity-meaning">ARCHIVE FINDER</h1>
      </div>
    </section>

    <section class="featured-reveal-section shell reveal-on-scroll" aria-label="Today's recommendation">
      <div class="today-recommend">
        <div class="today-recommend-head">
          <span>TODAY'S RECOMMEND</span>
        </div>
        <div class="today-recommend-copy">
          <p class="today-hook" id="todayHook"></p>
          <h2 id="todayTitle"></h2>
          <p class="today-artist" id="todayArtist"></p>
          <p class="today-intro" id="todayIntro"></p>
          <button class="today-open" id="todayOpen" type="button"><span>OPEN CURATION</span><span>↗</span></button>
        </div>
      </div>

      <button class="featured-card featured-card-reveal" id="todayCard" type="button">
        <div class="featured-cover" id="featuredCover"></div>
        <div class="featured-info">
          <div><h2 id="featuredTitle"></h2><p id="featuredArtist"></p></div>
          <p class="featured-note" id="featuredNote"></p>
        </div>
      </button>
    </section>

    <section class="home-preview shell reveal-on-scroll">
      <div class="section-kicker"><span>LATEST FINDS</span><a href="/finds/song/">VIEW ALL ↗</a></div>
      <div class="visual-grid preview-grid" id="homeGrid"></div>
    </section>
  </main>

  <footer class="site-footer shell">
    <div class="footer-row">
      <a class="footer-social" href="https://instagram.com/wh3n_5005" target="_blank" rel="noopener" aria-label="Instagram @wh3n_5005">

        <span class="footer-ig"><small>INSTAGRAM</small><strong>@wh3n_5005</strong><b>↗</b></span>
