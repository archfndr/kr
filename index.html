<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="ArchFndr — a personal archive of music worth finding.">
  <title>ArchFndr</title>
  <link rel="canonical" href="https://archfndr.kr/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=20260901-3">
</head>
<body class="page-home" data-page="home">
  <header class="site-header">
    <a class="brand" href="/">ARCHFNDR<span>.</span></a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="/finds/" data-en="FINDS" data-ko="발견">FINDS</a>
      <a href="/archive/" data-en="ARCHIVE" data-ko="아카이브">ARCHIVE</a>
      <a href="/about/" data-en="ABOUT" data-ko="소개">ABOUT</a>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" type="button" aria-label="한국어로 보기" title="한국어로 보기">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
      </button>
      <button class="menu-toggle" type="button" aria-label="Open menu">MENU</button>
    </div>
  </header>

  <main>
    <section class="home-hero shell">
      <div class="hero-copy">
        <h1 class="hero-title" aria-label="Find what you weren’t looking for.">
          <span data-en="Find what" data-ko="찾고 있지 않았던">Find what</span>
          <span data-en="you weren’t" data-ko="것을">you weren’t</span>
          <span data-en="looking for." data-ko="발견해.">looking for.</span>
        </h1>
        <div class="hero-bottom">
          <p data-en="A personal archive of songs worth keeping." data-ko="간직할 가치가 있는 음악을 모은 개인 아카이브.">A personal archive of songs worth keeping.</p>
          <a class="under-link" href="/finds/" data-en="BROWSE FINDS ↗" data-ko="음악 둘러보기 ↗">BROWSE FINDS ↗</a>
        </div>
      </div>

      <button class="featured-card" data-track="1" aria-label="Open Lost by Frank Ocean">
        <div class="featured-cover" id="featuredCover"></div>
        <div class="featured-info">
          <div>
            <span class="micro">ARCHIVE 1</span>
            <h2>Lost</h2>
            <p>Frank Ocean</p>
          </div>
          <p class="featured-note">“Love lost”</p>
        </div>
      </button>
    </section>

    <section class="home-preview shell">
      <div class="section-kicker">
        <span data-en="LATEST FINDS" data-ko="최근 발견">LATEST FINDS</span>
        <a href="/finds/" data-en="VIEW ALL ↗" data-ko="전체 보기 ↗">VIEW ALL ↗</a>
      </div>
      <div class="visual-grid preview-grid" id="homeGrid"></div>
    </section>
  </main>

  <footer class="site-footer shell">
    <div class="footer-mark">ARCHFNDR</div>
    <div class="footer-meta"><span data-en="CURATED IN SEOUL" data-ko="서울에서 큐레이션">CURATED IN SEOUL</span><span>© <span id="year"></span></span></div>
  </footer>

  <aside class="track-drawer" id="trackDrawer" aria-hidden="true">
    <button class="drawer-backdrop" data-close-drawer aria-label="Close"></button>
    <div class="drawer-panel">
      <button class="drawer-close" data-close-drawer aria-label="Close">×</button>
      <div id="drawerContent"></div>
    </div>
  </aside>

  <script src="/songs.js?v=20260901-3"></script>
  <script src="/script.js?v=20260901-3"></script>
</body>
</html>
